site_name: "NAT3054: Advanced Programming Tools in High-Energy Physics"

theme:
#  name: mkdocs
  name: material
#  name: readthedocs
  favicon: Figures/favicon.png
  logo: Figures/favicon.png

  palette:
    # Light mode
    - scheme: default
      primary: indigo # color used for header, sidebar, text links, ... 
      accent: indigo # color used for hovered links, buttons, scrollbars, focus states, ...
      toggle:
        icon: material/moon-last-quarter
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/moon-first-quarter
        name: Switch to light mode

  features:
    - content.code.copy
    - content.code.select   # Adds the line range selection button
# common navigation settings for all themes:
#nav:
#  - Home: index.md

# workaround to get figures via ./Figures, and not via ../Figures, even though the former is a correct relative path
use_directory_urls: false

# common extra CSS for all themes:
extra_css:
  - stylesheets/extra.css

# specific settings for individually themes:
hooks:
  - docs/hooks/conditional_nav.py # navigation settings but conditional and specific for each theme
  - docs/hooks/conditional_css.py # extra CSS but conditional and specific for each theme

# support for math and code syntax highlihting:
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets: # to inline in markdown code block a code from an external file
      base_path: # now also the relative paths will work, relative to docs/
        - docs
  - pymdownx.arithmatex: # math
      generic: true
  - pymdownx.highlight: # syntax highlighting
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences: # syntax highlighting
      custom_fences: # support for mermaid diagrams
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - attr_list # to resize figures
  - md_in_html # to resize figures

extra_javascript:
  - javascripts/mathjax-mkdocs.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js # online math
#  - javascripts/tex-mml-chtml.js # offline math

# needed to download a site in PDF:
plugins:
  - search
  - to-pdf:
      output_path: docs/pdf/NAT3054.pdf
      cover: false
#      cover_title: "NAT3054: Advanced Programming Tools in High-Energy Physics (WS 2026/27)"
      # ... other options
